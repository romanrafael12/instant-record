name: Build Windows
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    name: Build for Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Detect Visual Studio generator
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $full = & $vswhere -latest -property installationVersion
          $major = ($full -split '\.')[0]
          $map = @{ '18' = 'Visual Studio 18 2026'; '17' = 'Visual Studio 17 2022'; '16' = 'Visual Studio 16 2019' }
          $generator = $map[$major]
          if (-not $generator) { Write-Error "Unknown Visual Studio version: $full"; exit 1 }
          Write-Host "Detected generator: $generator (VS $full)"
          "generator=$generator" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Configure
        run: >
          cmake -S . -B build_x64
          -G "${{ steps.vs.outputs.generator }}"
          -A x64
          -DENABLE_QT=ON
          -DENABLE_FRONTEND_API=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build_x64 --config RelWithDebInfo -- /p:TreatWarningAsError=false
      - name: Assemble plugin
        run: >
          cmake --install build_x64
          --prefix "${{ github.workspace }}/release"
          --config RelWithDebInfo
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: instant-record-windows-x64
          path: release/**
          if-no-files-found: warn

      # ---- Windows installer (.exe) via Inno Setup ----
      - name: Stage installer files
        shell: pwsh
        run: |
          $stage = "installer\stage"
          New-Item -ItemType Directory -Force -Path "$stage\bin\64bit" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\data" | Out-Null
          $dll = Get-ChildItem -Recurse -Path build_x64 -Filter instant-record.dll |
                 Where-Object { $_.FullName -match 'RelWithDebInfo|Release' } | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem -Recurse -Path build_x64 -Filter instant-record.dll | Select-Object -First 1 }
          Copy-Item $dll.FullName "$stage\bin\64bit\instant-record.dll" -Force
          Copy-Item -Recurse -Force "data\*" "$stage\data\"
          Write-Host "Staged DLL: $($dll.FullName)"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $stage = (Resolve-Path "installer\stage").Path
          & $iscc "/DMyStage=$stage" "/DMyVersion=1.0.$env:GITHUB_RUN_NUMBER" "installer\instant-record.iss"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: instant-record-installer
          path: installer\Output\*.exe
          if-no-files-found: warn

      # ---- Publish the installer to a public 'latest' release ----
      # Makes https://github.com/romanrafael12/instant-record/releases/latest/download/InstantRecord-Setup.exe
      # always point at the newest installer (no login, never expires).
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically built installer for the latest commit on main.
          make_latest: true
          files: installer/Output/InstantRecord-Setup.exe

      - name: Upload raw build (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instant-record-build-raw
          path: |
            build_x64/**/*.dll
            build_x64/**/*.pdb
          if-no-files-found: ignore
