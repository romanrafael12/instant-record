name: Build Windows
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    name: Build for Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Detect Visual Studio generator
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $full = & $vswhere -latest -property installationVersion
          $major = ($full -split '\.')[0]
          $map = @{ '18' = 'Visual Studio 18 2026'; '17' = 'Visual Studio 17 2022'; '16' = 'Visual Studio 16 2019' }
          $generator = $map[$major]
          if (-not $generator) { Write-Error "Unknown Visual Studio version: $full"; exit 1 }
          Write-Host "Detected generator: $generator (VS $full)"
          "generator=$generator" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Configure
        run: >
          cmake -S . -B build_x64
          -G "${{ steps.vs.outputs.generator }}"
          -A x64
          -DENABLE_QT=ON
          -DENABLE_FRONTEND_API=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build_x64 --config RelWithDebInfo
      - name: Assemble plugin
        run: >
          cmake --install build_x64
          --prefix "${{ github.workspace }}/release"
          --config RelWithDebInfo
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: instant-record-windows-x64
          path: release/**
          if-no-files-found: warn
      - name: Upload raw build (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instant-record-build-raw
          path: |
            build_x64/**/*.dll
            build_x64/**/*.pdb
          if-no-files-found: ignore
