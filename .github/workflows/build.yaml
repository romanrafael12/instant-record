name: Build Windows
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    name: Build for Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-ci-x64
      - name: Build
        run: cmake --build --preset windows-ci-x64
      - name: Assemble plugin
        run: >
          cmake --install build_x64
          --prefix "${{ github.workspace }}/release"
          --config RelWithDebInfo
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: instant-record-windows-x64
          path: release/**
          if-no-files-found: warn
      - name: Upload raw build (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instant-record-build-raw
          path: |
            build_x64/**/*.dll
            build_x64/**/*.pdb
          if-no-files-found: ignore
