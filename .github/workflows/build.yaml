name: Build Windows
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    name: Build for Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Detect Visual Studio generator
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Error "vswhere not found"; exit 1 }
          $ver = & $vswhere -latest -property catalog_productLineVersion
          if (-not $ver) {
            $full = & $vswhere -latest -property installationVersion
            $major = ($full -split '\.')[0]
            $ver = @{ '17' = '2022'; '18' = '2026' }[$major]
          }
          $generator = "Visual Studio " + @{ '2022' = '17'; '2026' = '18' }[$ver] + " " + $ver
          Write-Host "Detected Visual Studio generator: $generator"
          "generator=$generator" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Configure
        run: cmake --preset windows-ci-x64 -G "${{ steps.vs.outputs.generator }}"
      - name: Build
        run: cmake --build --preset windows-ci-x64
      - name: Assemble plugin
        run: >
          cmake --install build_x64
          --prefix "${{ github.workspace }}/release"
          --config RelWithDebInfo
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: instant-record-windows-x64
          path: release/**
          if-no-files-found: warn
      - name: Upload raw build (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instant-record-build-raw
          path: |
            build_x64/**/*.dll
            build_x64/**/*.pdb
          if-no-files-found: ignore
